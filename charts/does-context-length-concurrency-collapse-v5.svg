<text x="70" y="237.3" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#374151">32</text>
<line x1="80" y1="276.7" x2="860" y2="276.7" stroke="#e5e7eb" stroke-width="1"/>
